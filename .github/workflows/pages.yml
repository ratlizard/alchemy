# Build the browser module from the systemless fork and publish web/www/ to
# GitHub Pages. The game is not in this repository and is not fetched here:
# the page fetches it from archive.org when it opens.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: alchemy
      - uses: actions/checkout@v4
        with:
          repository: ratlizard/systemless
          ref: cythera-detailed
          path: systemless
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: alchemy/web/cythera-web
      - run: cargo build --release --target wasm32-unknown-unknown --manifest-path alchemy/web/cythera-web/Cargo.toml
      - run: cp alchemy/web/cythera-web/target/wasm32-unknown-unknown/release/cythera_web.wasm alchemy/web/www/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: alchemy/web/www
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
