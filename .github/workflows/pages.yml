# Build the browser module from the systemless fork and publish web/www/ to
# the gh-pages branch, which GitHub Pages serves (Settings > Pages > Deploy
# from a branch > gh-pages, root). The game is not in this repository and is
# not fetched here: the page fetches it from archive.org when it opens.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: alchemy
      - uses: actions/checkout@v4
        with:
          repository: ratlizard/systemless
          ref: cythera-detailed
          path: systemless
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: alchemy/web/cythera-web
      - run: cargo build --release --target wasm32-unknown-unknown --manifest-path alchemy/web/cythera-web/Cargo.toml
      - run: cp alchemy/web/cythera-web/target/wasm32-unknown-unknown/release/cythera_web.wasm alchemy/web/www/
      - name: publish web/www to gh-pages
        working-directory: alchemy/web/www
        run: |
          touch .nojekyll
          sed -i "s/__BUILD__/${GITHUB_SHA:0:8}/" index.html
          git init -q -b gh-pages
          git -c user.name=e-z-g -c user.email=e-z-g@users.noreply.github.com add -A
          git -c user.name=e-z-g -c user.email=e-z-g@users.noreply.github.com commit -q -m "site from ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
