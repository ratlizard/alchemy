<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Cythera, systemless, in the browser</title>
<style>
  html, body { margin: 0; background: #111; color: #ddd; font: 13px/1.4 system-ui, sans-serif; height: 100%; }
  #bar { padding: 6px 10px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  #bar button { font: inherit; }
  #stage { display: flex; justify-content: center; align-items: center; }
  canvas { image-rendering: pixelated; width: 100vw; max-height: calc(100vh - 40px); object-fit: contain; touch-action: none; background: #000; }
  #log { white-space: pre-wrap; font: 11px/1.3 ui-monospace, monospace; padding: 4px 10px; max-height: 30vh; overflow: auto; }
  body.playing #log { display: none; }
  #stage { position: relative; }
  /* The touch shell: shown only where the pointer is a finger. Two pads over
     the bottom corners of the canvas; the game's control bar sits at the
     bottom of its screen, so the pads are translucent and can be dragged by
     their title to wherever the hand and the game agree. */
  #hud { display: none; position: fixed; inset: 0; pointer-events: none; touch-action: none; }
  body.playing.touch #hud { display: block; }
  .pad { position: absolute; pointer-events: auto; background: rgba(20,20,20,.55); border: 1px solid rgba(255,255,255,.25); border-radius: 10px; padding: 4px; user-select: none; -webkit-user-select: none; backdrop-filter: blur(2px); }
  .pad .title { font: 600 10px/1 system-ui, sans-serif; letter-spacing: .08em; color: #bbb; text-align: center; padding: 4px 0 6px; cursor: move; }
  .grid { display: grid; gap: 4px; }
  #move .grid { grid-template-columns: repeat(3, 52px); }
  #act .grid { grid-template-columns: repeat(3, 58px); }
  .k { height: 46px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: rgba(255,255,255,.14); color: #eee; font: 600 14px/1 system-ui, sans-serif; text-align: center; }
  .k:active, .k.held { background: rgba(255,220,120,.6); color: #000; }
  .k small { display: block; font-weight: 400; font-size: 10px; color: #bbb; margin-top: 2px; }
  .k.held small, .k:active small { color: #333; }
  #move { left: 8px; bottom: 8px; }
  #act { right: 8px; bottom: 8px; }
  #kb { position: absolute; left: -1000px; top: 0; width: 10px; height: 10px; opacity: 0; }
  #armed { position: fixed; top: 44px; left: 50%; transform: translateX(-50%); padding: 4px 10px; border-radius: 6px; background: rgba(255,220,120,.85); color: #000; font: 600 12px/1 system-ui, sans-serif; display: none; pointer-events: none; }
</style>
<div id="bar">
  <button id="bench">Benchmark (headless to start screen)</button>
  <button id="play">Play (real time)</button>
  <label><input type="file" id="file"> pick a .sit instead of game.sit</label>
  <span id="stat"></span>
</div>
<div id="stage"><canvas id="screen" width="800" height="600"></canvas></div>
<div id="armed"></div>
<div id="hud">
  <div class="pad" id="move">
    <div class="title">MOVE</div>
    <div class="grid">
      <div class="k" data-key="Numpad7">&#8598;</div><div class="k" data-key="Numpad8">&#8593;</div><div class="k" data-key="Numpad9">&#8599;</div>
      <div class="k" data-key="Numpad4">&#8592;</div><div class="k" data-key="Space">&#9203;<small>pass</small></div><div class="k" data-key="Numpad6">&#8594;</div>
      <div class="k" data-key="Numpad1">&#8601;</div><div class="k" data-key="Numpad2">&#8595;</div><div class="k" data-key="Numpad3">&#8600;</div>
    </div>
  </div>
  <div class="pad" id="act">
    <div class="title">COMMANDS</div>
    <div class="grid">
      <div class="k" data-key="KeyG">Get<small>G</small></div><div class="k" data-key="KeyT">Talk<small>T</small></div><div class="k" data-key="KeyL">Look<small>L</small></div>
      <div class="k" data-key="KeyU">Use<small>U</small></div><div class="k" data-key="KeyA">Attack<small>A</small></div><div class="k" data-key="KeyM">Move<small>M cancels</small></div>
      <div class="k" data-key="Escape">Esc</div><div class="k" data-key="Enter">Return</div><div class="k" id="kbtoggle">Type<small>keyboard</small></div>
    </div>
  </div>
</div>
<input id="kb" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Type into the game">
<div id="log"></div>
<script>
'use strict';
const logEl = document.getElementById('log'), statEl = document.getElementById('stat');
function say(s) { logEl.textContent += s + '\n'; logEl.scrollTop = logEl.scrollHeight; console.log(s); }
const dec = new TextDecoder();
let wasm, mem;
const env = { cw_log(p, n) { say(dec.decode(new Uint8Array(mem.buffer, p, n))); } };

async function loadWasm() {
  const t0 = performance.now();
  const r = await WebAssembly.instantiateStreaming(fetch('cythera_web.wasm'), { env });
  wasm = r.instance.exports; mem = wasm.memory;
  wasm.cw_init();
  say(`wasm loaded in ${(performance.now() - t0).toFixed(0)} ms`);
}
// The game is not in this repository. A game.sit served beside the page wins
// (a local checkout with a symlink to the installed-folder archive); otherwise
// archive.org's "Cythera installers" item, the 28 MB StuffIt archive holding
// the 1.0.1-1.0.4 installers, through the /cors/ path that sends the CORS
// header. systemless expands the 1.0.4 Installer VISE payload itself.
const GAME_SOURCES = [
  'game.sit',
  'https://archive.org/cors/cythera-installers/Cythera%20installers.sit',
];
let gameBytes = null;
async function getGame() {
  if (gameBytes) return gameBytes;
  for (const url of GAME_SOURCES) {
    const t0 = performance.now();
    let res;
    try { res = await fetch(url); } catch (e) { say(`${url}: ${e.message}`); continue; }
    if (!res.ok) { say(`${url}: ${res.status}`); continue; }
    gameBytes = new Uint8Array(await res.arrayBuffer());
    say(`game fetched from ${url}: ${gameBytes.length} bytes in ${(performance.now() - t0).toFixed(0)} ms`);
    return gameBytes;
  }
  throw new Error('no game source answered; pick a .sit with the file control');
}
document.getElementById('file').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  gameBytes = new Uint8Array(await f.arrayBuffer());
  say(`picked ${f.name}: ${gameBytes.length} bytes`);
});

const MAC_EPOCH_OFFSET = 2082844800;
// Cythera's start screen is laid out for 640x480 and the game itself runs at
// any larger size, its windows free to move. So: portrait keeps 640 wide and
// fills the height, landscape keeps 480 high and fills the width, and the
// canvas then covers the viewport at the device's aspect. ?w=&h= overrides.
function chooseScreen() {
  const q = new URLSearchParams(location.search);
  if (q.get('w') && q.get('h')) return [Math.max(640, +q.get('w')), Math.max(480, +q.get('h'))];
  const vw = window.innerWidth, vh = Math.max(1, window.innerHeight - 40);
  if (vh >= vw) return [640, Math.min(2048, Math.max(480, Math.round(640 * vh / vw)))];
  return [Math.min(2048, Math.max(640, Math.round(480 * vw / vh))), 480];
}
let booted = false, W = 0, H = 0, canvas = document.getElementById('screen'), ctx = canvas.getContext('2d');
async function boot() {
  if (booted) return;
  const bytes = await getGame();
  const p = wasm.cw_alloc(bytes.length);
  new Uint8Array(mem.buffer, p, bytes.length).set(bytes);
  const t0 = performance.now();
  const [sw, sh] = chooseScreen();
  const rc = wasm.cw_boot(p, bytes.length, Math.floor(Date.now() / 1000) + MAC_EPOCH_OFFSET, sw, sh);
  if (rc !== 0) throw new Error(dec.decode(new Uint8Array(mem.buffer, wasm.cw_error_ptr(), wasm.cw_error_len())));
  W = wasm.cw_width(); H = wasm.cw_height();
  canvas.width = W; canvas.height = H;
  say(`booted in ${(performance.now() - t0).toFixed(0)} ms, screen ${W}x${H}, ${wasm.cw_instructions_per_tick()} instructions/tick`);
  booted = true;
}
function present() {
  const p = wasm.cw_render();
  const px = new Uint8ClampedArray(mem.buffer, p, W * H * 4);
  ctx.putImageData(new ImageData(px, W, H), 0, 0);
}

// --- benchmark: headless pacing, comparable with the native --max-instructions figure
let mode = null;
document.getElementById('bench').onclick = async () => {
  await boot(); mode = 'bench';
  const target = 85_000_000, chunk = 1_000_000;
  let done = 0, t0 = performance.now(), lastReport = t0;
  function step() {
    if (mode !== 'bench') return;
    const t = performance.now();
    while (done < target && performance.now() - t < 40) {
      done += wasm.cw_run_headless(chunk);
      if (!wasm.cw_running()) { say('guest halted'); mode = null; break; }
    }
    present();
    const now = performance.now(), secs = (now - t0) / 1000;
    if (now - lastReport > 1000 || done >= target) {
      statEl.textContent = `${(done / 1e6).toFixed(0)}M instructions, ${secs.toFixed(1)} s, ${(done / secs / 1e6).toFixed(2)} M/s, tick ${wasm.cw_tick()}`;
      lastReport = now;
    }
    if (done >= target) { say(`benchmark: ${done} instructions in ${secs.toFixed(2)} s = ${(done / secs / 1e6).toFixed(2)} M instructions/s`); mode = null; return; }
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
};

// --- play: wall-clock pacing, like the desktop runner
const VBL_HZ = 60.15, RATE = 22050, MAX_STEPS = 2_000_000;
let audioCtx = null, nextAudioTime = 0;
function pushAudio() {
  const n = wasm.cw_audio_len(); if (!n || !audioCtx) return;
  const src = new Uint8Array(mem.buffer, wasm.cw_audio_drain(), n);
  const buf = audioCtx.createBuffer(1, n, RATE), ch = buf.getChannelData(0);
  for (let i = 0; i < n; i++) ch[i] = (src[i] - 128) / 128;
  const node = audioCtx.createBufferSource(); node.buffer = buf; node.connect(audioCtx.destination);
  const t = Math.max(audioCtx.currentTime + 0.02, nextAudioTime);
  node.start(t); nextAudioTime = t + n / RATE;
}
const isTouch = matchMedia('(pointer: coarse)').matches;
if (isTouch) document.body.classList.add('touch');
document.getElementById('play').onclick = async () => {
  await boot(); mode = 'play'; document.body.classList.add('playing');
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  audioCtx.resume();
  const startTick = wasm.cw_tick(), t0 = performance.now();
  let audioRemainder = 0, lastT = t0, insWindow = 0, winT = t0;
  function frame() {
    if (mode !== 'play') return;
    const now = performance.now();
    const deadline = startTick + Math.floor((now - t0) / 1000 * VBL_HZ);
    const dt = Math.min(now - lastT, 100); lastT = now;
    const want = dt / 1000 * RATE + audioRemainder, samples = Math.floor(want); audioRemainder = want - samples;
    let steps = 0;
    while (wasm.cw_tick() < deadline && steps < MAX_STEPS && performance.now() - now < 12) {
      steps += wasm.cw_run(MAX_STEPS - steps, deadline, samples - (steps ? samples : 0));
      if (!wasm.cw_running()) { say('guest halted'); mode = null; break; }
    }
    if (!steps) wasm.cw_run(0, deadline, samples); // still mix audio on an idle frame
    insWindow += steps;
    if (now - winT > 1000) { statEl.textContent = `${(insWindow / ((now - winT) / 1000) / 1e6).toFixed(2)} M/s, tick ${wasm.cw_tick()} vs ${deadline}`; insWindow = 0; winT = now; }
    pushAudio(); present();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
};

// --- input: the pointer
function guestPoint(e) {
  const r = canvas.getBoundingClientRect();
  // object-fit: contain letterboxes the canvas inside its box; map through
  // the drawn rectangle, not the element.
  const scale = Math.min(r.width / W, r.height / H);
  const left = r.left + (r.width - W * scale) / 2, top = r.top + (r.height - H * scale) / 2;
  const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
  return [clamp(Math.round((e.clientY - top) / scale), 0, H - 1), clamp(Math.round((e.clientX - left) / scale), 0, W - 1)];
}
// Cythera tests StillDown, and a finger's tap can be shorter than the guest's
// first poll after the mouse-down. The release waits until the button has
// been down for MIN_HOLD_MS, so a tap is a click and a hold is a hold; a drag
// is unaffected because its release comes later anyway.
const MIN_HOLD_MS = 160;
let downAt = 0, pendingUp = null;
function mouseUpAt(v, h) {
  const wait = downAt + MIN_HOLD_MS - performance.now();
  if (pendingUp) clearTimeout(pendingUp);
  if (wait > 0) pendingUp = setTimeout(() => { pendingUp = null; wasm.cw_mouse_up(v, h); }, wait);
  else wasm.cw_mouse_up(v, h);
}
canvas.addEventListener('pointermove', e => { if (!booted) return; const [v, h] = guestPoint(e); wasm.cw_mouse_move(v, h); });
canvas.addEventListener('pointerdown', e => {
  if (!booted) return;
  e.preventDefault(); canvas.setPointerCapture(e.pointerId);
  if (pendingUp) { clearTimeout(pendingUp); pendingUp = null; const [pv, ph] = guestPoint(e); wasm.cw_mouse_up(pv, ph); }
  const [v, h] = guestPoint(e); wasm.cw_mouse_move(v, h); wasm.cw_mouse_down(v, h); downAt = performance.now();
});
canvas.addEventListener('pointerup', e => { if (!booted) return; const [v, h] = guestPoint(e); mouseUpAt(v, h); });
canvas.addEventListener('pointercancel', e => { if (!booted) return; const [v, h] = guestPoint(e); mouseUpAt(v, h); });
canvas.addEventListener('contextmenu', e => e.preventDefault());

// --- input: the touch shell. Every key it presses goes through heldKeys so
// that nothing can stay down when a finger leaves, the page hides or the
// game is paused; a stuck movement key is a character who walks off alone.
const heldKeys = new Map();
function keyOf(code) { return MAC_KEY[code]; }
function charOf(code) {
  if (MAC_CHAR[code] !== undefined) return MAC_CHAR[code];
  if (/^Key[A-Z]$/.test(code)) return code.charCodeAt(3) + 32;
  if (/^Numpad[0-9]$/.test(code)) return code.charCodeAt(6);
  return 0;
}
function pressCode(code) {
  const k = keyOf(code); if (k === undefined || !booted || heldKeys.has(code)) return;
  heldKeys.set(code, true); wasm.cw_key_down(k, charOf(code));
}
function releaseCode(code) {
  const k = keyOf(code); if (k === undefined || !booted || !heldKeys.delete(code)) return;
  wasm.cw_key_up(k, charOf(code));
}
function releaseAll() { for (const code of Array.from(heldKeys.keys())) releaseCode(code); }
document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });
window.addEventListener('blur', releaseAll);

// The command letters arm a mode the next direction directs (the manual,
// p.6: G+arrow gets, L+arrow looks, A attacks, T talks, U uses; M cancels).
// The mode clears itself after the command runs, so this only echoes what
// was pressed; the game's own MOVE/TAKE/... tab is the readout.
const ARMS = { KeyG: 'Get: choose a direction', KeyT: 'Talk: choose a direction', KeyL: 'Look: choose a direction', KeyU: 'Use: choose a direction', KeyA: 'Attack: choose a direction', KeyM: 'Move' };
const armedEl = document.getElementById('armed');
let armedTimer = null;
function showArmed(text) {
  armedEl.textContent = text; armedEl.style.display = 'block';
  clearTimeout(armedTimer); armedTimer = setTimeout(() => armedEl.style.display = 'none', 2500);
}
for (const el of document.querySelectorAll('#hud .k[data-key]')) {
  const code = el.dataset.key;
  el.addEventListener('pointerdown', e => {
    e.preventDefault(); el.setPointerCapture(e.pointerId);
    pressCode(code); el.classList.add('held');
    if (ARMS[code]) showArmed(ARMS[code]);
  });
  const up = e => { releaseCode(code); el.classList.remove('held'); };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('lostpointercapture', up);
}
// Pads move by their title, and remember where they were put.
for (const pad of document.querySelectorAll('.pad')) {
  const title = pad.querySelector('.title'); let drag = null;
  try { const saved = JSON.parse(localStorage.getItem('pad:' + pad.id) || 'null'); if (saved) { pad.style.left = saved.left; pad.style.top = saved.top; pad.style.right = 'auto'; pad.style.bottom = 'auto'; } } catch (e) {}
  title.addEventListener('pointerdown', e => { e.preventDefault(); title.setPointerCapture(e.pointerId); const r = pad.getBoundingClientRect(); drag = { dx: e.clientX - r.left, dy: e.clientY - r.top }; });
  title.addEventListener('pointermove', e => { if (!drag) return; pad.style.left = (e.clientX - drag.dx) + 'px'; pad.style.top = (e.clientY - drag.dy) + 'px'; pad.style.right = 'auto'; pad.style.bottom = 'auto'; });
  const end = () => { if (!drag) return; drag = null; try { localStorage.setItem('pad:' + pad.id, JSON.stringify({ left: pad.style.left, top: pad.style.top })); } catch (e) {} };
  title.addEventListener('pointerup', end); title.addEventListener('pointercancel', end);
}

// Typing: a hidden input raises the phone's keyboard; each character it
// receives goes to the game as a key down and up, Backspace and Return by
// their own keys. Cythera needs text for a character's name and for what is
// said in conversation, so this is not optional.
const kb = document.getElementById('kb');
const CHAR_KEY = {};
for (const [code, k] of Object.entries(MAC_KEY)) {
  if (/^Key[A-Z]$/.test(code)) CHAR_KEY[code[3].toLowerCase()] = k;
  if (/^Digit[0-9]$/.test(code)) CHAR_KEY[code[5]] = k;
}
Object.assign(CHAR_KEY, { ' ': 0x31, '-': 0x1B, '=': 0x18, '[': 0x21, ']': 0x1E, '\\': 0x2A, ';': 0x29, "'": 0x27, ',': 0x2B, '.': 0x2F, '/': 0x2C, '`': 0x32 });
function typeChar(ch) {
  if (!booted) return;
  const c = ch.charCodeAt(0); if (c > 126) return;
  const k = CHAR_KEY[ch.toLowerCase()] ?? 0x00;
  const shift = ch !== ch.toLowerCase() || '~!@#$%^&*()_+{}|:"<>?'.includes(ch);
  if (shift) wasm.cw_key_down(0x38, 0);
  wasm.cw_key_down(k, c); wasm.cw_key_up(k, c);
  if (shift) wasm.cw_key_up(0x38, 0);
}
kb.addEventListener('input', () => { for (const ch of kb.value) typeChar(ch); kb.value = ''; });
kb.addEventListener('keydown', e => {
  if (e.key === 'Backspace') { e.preventDefault(); wasm.cw_key_down(0x33, 8); wasm.cw_key_up(0x33, 8); }
  else if (e.key === 'Enter') { e.preventDefault(); wasm.cw_key_down(0x24, 13); wasm.cw_key_up(0x24, 13); }
  else if (e.key === 'Escape') { e.preventDefault(); wasm.cw_key_down(0x35, 27); wasm.cw_key_up(0x35, 27); kb.blur(); }
});
document.getElementById('kbtoggle').addEventListener('pointerdown', e => {
  e.preventDefault();
  if (document.activeElement === kb) kb.blur(); else kb.focus();
});

// KeyboardEvent.code -> Mac virtual key code, the desktop runner's table.
const MAC_KEY = { KeyA:0x00,KeyS:0x01,KeyD:0x02,KeyF:0x03,KeyH:0x04,KeyG:0x05,KeyZ:0x06,KeyX:0x07,KeyC:0x08,KeyV:0x09,KeyB:0x0B,KeyQ:0x0C,KeyW:0x0D,KeyE:0x0E,KeyR:0x0F,KeyY:0x10,KeyT:0x11,Digit1:0x12,Digit2:0x13,Digit3:0x14,Digit4:0x15,Digit6:0x16,Digit5:0x17,Equal:0x18,Digit9:0x19,Digit7:0x1A,Minus:0x1B,Digit8:0x1C,Digit0:0x1D,BracketRight:0x1E,KeyO:0x1F,KeyU:0x20,BracketLeft:0x21,KeyI:0x22,KeyP:0x23,Enter:0x24,KeyL:0x25,KeyJ:0x26,Quote:0x27,KeyK:0x28,Semicolon:0x29,Backslash:0x2A,Comma:0x2B,Slash:0x2C,KeyN:0x2D,KeyM:0x2E,Period:0x2F,Tab:0x30,Space:0x31,Backquote:0x32,Backspace:0x33,Escape:0x35,MetaLeft:0x37,MetaRight:0x37,ShiftLeft:0x38,CapsLock:0x39,AltLeft:0x3A,ControlLeft:0x3B,ShiftRight:0x3C,AltRight:0x3D,ControlRight:0x3E,NumpadDecimal:0x41,NumpadMultiply:0x43,NumpadAdd:0x45,NumLock:0x47,NumpadDivide:0x4B,NumpadEnter:0x4C,NumpadSubtract:0x4E,NumpadEqual:0x51,Numpad0:0x52,Numpad1:0x53,Numpad2:0x54,Numpad3:0x55,Numpad4:0x56,Numpad5:0x57,Numpad6:0x58,Numpad7:0x59,Numpad8:0x5B,Numpad9:0x5C,ArrowLeft:0x7B,ArrowRight:0x7C,ArrowDown:0x7D,ArrowUp:0x7E,F1:0x7A,F2:0x78,F3:0x63,F4:0x76,F5:0x60 };
const MAC_CHAR = { Enter:13,NumpadEnter:3,Tab:9,Space:32,Backspace:8,Escape:27,ArrowLeft:28,ArrowRight:29,ArrowUp:30,ArrowDown:31 };
function macChar(e) {
  if (e.key.length === 1 && e.key.charCodeAt(0) < 128) return e.key.charCodeAt(0);
  return MAC_CHAR[e.code] || 0;
}
window.addEventListener('keydown', e => { if (!booted || e.target.tagName === 'INPUT') return; const k = MAC_KEY[e.code]; if (k === undefined) return; e.preventDefault(); if (!e.repeat) wasm.cw_key_down(k, macChar(e)); });
window.addEventListener('keyup', e => { if (!booted) return; const k = MAC_KEY[e.code]; if (k === undefined) return; e.preventDefault(); wasm.cw_key_up(k, macChar(e)); });

loadWasm().catch(e => say('load failed: ' + e));
</script>
